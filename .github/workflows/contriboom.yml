name: Update contribution animation

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contriboom-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check out Contriboom
        uses: actions/checkout@v7
        with:
          repository: ststyin/contriboom
          ref: v1.0.0
          path: .contriboom

      - name: Generate Pepsi contribution map
        run: node scripts/generate-pepsi-calendar.mjs .contriboom-input.json

      - name: Generate contribution arena
        run: node .contriboom/src/cli.ts --input .contriboom-input.json --output images/contriboom --theme github --mode clear --block-damage instant --range 10 --seed 42

      - name: Commit updated images
        shell: bash
        env:
          SVG: images/contriboom/game.svg
          SVG_STATIC: images/contriboom/game-static.svg
        run: |
          git add -f -- "$SVG" "$SVG_STATIC"
          if git diff --cached --quiet; then
            echo "Contribution images are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update contribution animation"
          git push